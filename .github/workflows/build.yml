name: Build Test Mindset

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 21 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter setup (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform files banana (android + web)
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/muhammad/mindset/MainActivity.kt /tmp/MainActivity.kt
          cp -r android/app/src/main/res /tmp/res-backup
          rm -f android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts android/app/build.gradle android/app/build.gradle.kts android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties
          flutter create --org com.muhammad --project-name test_mindset --platforms android,web .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/muhammad/mindset
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/muhammad/mindset/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/muhammad/test_mindset
          cp -r /tmp/res-backup/. android/app/src/main/res/
          sed -i 's/com.muhammad.test_mindset/com.muhammad.mindset/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/com.muhammad.test_mindset/com.muhammad.mindset/g' android/app/build.gradle 2>/dev/null || true
          sed -i '/com.android.application/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts 2>/dev/null || true
          sed -i '/com.android.application/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle 2>/dev/null || true
          sed -i '/com.android.application/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts 2>/dev/null || true
          sed -i '/com.android.application/a\    id "com.google.gms.google-services"' android/app/build.gradle 2>/dev/null || true

      - name: Packages lena
        run: flutter pub get

      - name: Release lint band karna
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n    }\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: Release APK banana
        run: flutter build apk --release

      - name: Sign APK with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | head -5

      - name: APK save karna (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: testmindset-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Web build banana
        run: flutter build web --release

      - name: Web build save karna
        uses: actions/upload-artifact@v4
        with:
          name: testmindset-web
          path: build/web
